name: Android CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android SDK 33
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.0"
      - name: Build IDE + sample APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :sample:assembleDebug --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzFCS-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            sample/build/outputs/apk/debug/sample-debug.apk
