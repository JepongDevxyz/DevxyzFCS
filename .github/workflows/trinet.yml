name: TriNet CI
on:
  push:
    branches: [ main ]
    paths: [ 'trinet/**', '.github/workflows/trinet.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android SDK 33
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.0"
      - name: Build TriNet module
        run: |
          chmod +x gradlew
          ./gradlew :trinet:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trinet-debug
          path: trinet/build/outputs/apk/debug/trinet-debug.apk
